# Напоминания в Telegram: раз в 10 минут дёргает /api/cron/reminders.
# Нужен секрет репозитория CRON_SECRET — то же значение, что в Vercel.
name: Telegram reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://bootcamp.tryoszone.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET не задан — пропускаю"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
